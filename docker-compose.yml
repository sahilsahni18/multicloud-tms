# TrackFlow local stack: MySQL + backend + frontend.
#
#   docker compose up -d --build     then open http://localhost:3000
#   docker compose down              (add -v to also wipe the database)
#
# Override ports or credentials in .env (see .env.example).
name: trackflow

x-db-env: &db-env
  MYSQL_DATABASE: ${MYSQL_DATABASE:-trackflow}
  MYSQL_USER: ${MYSQL_USER:-trackflow}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trackflow_local}

services:
  mysql:
    image: mysql:8.0
    container_name: trackflow-mysql
    environment:
      <<: *db-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once init is done (the init server runs without networking).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    image: trackflow-backend:local
    container_name: trackflow-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # local = demo users + dev JWT key + non-secure cookie (plain http)
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-trackflow}
      DB_USERNAME: ${MYSQL_USER:-trackflow}
      DB_PASSWORD: ${MYSQL_PASSWORD:-trackflow_local}
      APP_CLOUD: docker
      APP_REGION: local
    ports:
      - "${BACKEND_PORT:-8080}:8080"   # Swagger: http://localhost:8080/swagger-ui.html
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: trackflow-frontend:local
    container_name: trackflow-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped

  # Runs the migrations without the backend (debugging the schema):
  #   docker compose --profile tools run --rm flyway migrate
  flyway:
    image: flyway/flyway:10
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-trackflow}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${MYSQL_USER:-trackflow}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-trackflow_local}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/demo
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./backend/src/main/resources/db:/flyway/sql:ro

volumes:
  mysql-data:
