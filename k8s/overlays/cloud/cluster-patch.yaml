# Placeholder values so the overlay renders in CI; the deploy workflow
# overwrites this file per cluster before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # demo-data seeds the four demo users and sample tickets (dev only).
  SPRING_PROFILES_ACTIVE: cloud,demo-data
  DB_URL: jdbc:mysql://set-by-deploy-workflow:3306/trackflow?sslMode=REQUIRED
  CORS_ALLOWED_ORIGINS: https://set-by-deploy-workflow
  APP_CLOUD: set-by-deploy-workflow
  APP_REGION: set-by-deploy-workflow
  REFRESH_COOKIE_SECURE: "true"
