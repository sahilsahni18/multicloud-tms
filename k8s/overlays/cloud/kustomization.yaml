# EKS and AKS: backend only (the SPA is served from CloudFront / Static Web
# Apps), databases are RDS / MySQL Flexible outside the cluster.
#
# The deploy workflow (.github/workflows/deploy.yml), per cluster:
#   1. overwrites cluster-patch.yaml with that cluster's cloud, region, DB URL
#      and allowed origins (values from `tofu output`),
#   2. creates the backend-secrets Secret (DB password, JWT key from state),
#   3. pins the image:  kustomize edit set image trackflow-backend=<registry>/trackflow-backend:<sha>
#   4. kubectl apply -k k8s/overlays/cloud
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trackflow

resources:
  - namespace.yaml
  - ../../base

images:
  - name: trackflow-backend
    newName: trackflow-backend
    newTag: set-by-deploy-workflow

patches:
  - path: cluster-patch.yaml
