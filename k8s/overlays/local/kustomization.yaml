# kind on a laptop: backend + frontend + MySQL in the cluster, demo data,
# plain http on http://localhost:8088. Apply with:  kubectl apply -k k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trackflow

resources:
  - namespace.yaml
  - ../../base
  - ../../frontend
  - mysql.yaml

images:
  - name: trackflow-backend
    newName: trackflow-backend
    newTag: local
  - name: trackflow-frontend
    newName: trackflow-frontend
    newTag: local

# DEV-ONLY credentials for the throwaway kind database. Cloud overlays get
# their Secret from the CD pipeline (GitHub secrets), never from this repo.
secretGenerator:
  - name: backend-secrets
    literals:
      - DB_USERNAME=trackflow
      - DB_PASSWORD=trackflow_local
      - JWT_SECRET=+w2sC+J0eNRQL4fuiDI7K0w8c1Wf2UZA/CqfNaSOK2uJBaJSyYYU0Fzsyxa09cPfYifkHUlySg0mLm13OOiHuw==
  - name: mysql-secrets
    literals:
      - MYSQL_ROOT_PASSWORD=root_local
      - MYSQL_DATABASE=trackflow
      - MYSQL_USER=trackflow
      - MYSQL_PASSWORD=trackflow_local

patches:
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: cloud,demo-data
      - op: replace
        path: /data/DB_URL
        value: jdbc:mysql://mysql:3306/trackflow
      - op: replace
        path: /data/REFRESH_COOKIE_SECURE
        value: "false"
      - op: replace
        path: /data/APP_CLOUD
        value: kind
      - op: replace
        path: /data/APP_REGION
        value: local
      # kind maps host 8088 to the ingress on 80, so the backend sees port 80
      # while the browser sends Origin :8088; without this, Spring rejects
      # the SPA's own POSTs as cross-origin ("Invalid CORS request").
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: http://localhost:8088
  # Wait for MySQL before starting Spring (cloud databases are always up).
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-mysql
            image: busybox:1.37
            command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
