# Non-secret backend settings. Overlays patch the values per environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  SPRING_PROFILES_ACTIVE: cloud
  DB_URL: jdbc:mysql://CHANGE-ME:3306/trackflow
  CORS_ALLOWED_ORIGINS: ""
  REFRESH_COOKIE_SECURE: "true"
  REFRESH_COOKIE_SAME_SITE: Strict
  APP_CLOUD: unknown
  APP_REGION: unknown
  DEPLOY_RUNNER: SIMULATED
  DB_POOL_SIZE: "10"
