# SonarQube / SonarCloud analysis of the whole repository:
# Java backend, TypeScript frontend, Kubernetes manifests, OpenTofu and Dockerfiles.
sonar.projectKey=Chetansahney_multicloud-tms
sonar.projectName=TrackFlow
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/src,k8s,infra,Dockerfile.render,backend/Dockerfile,frontend/Dockerfile
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,backend/src/test/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,**/node_modules/**,**/.terraform/**

# Java
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Coverage reports (mvn verify / vitest --coverage)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Reviewed security hotspots, accepted on purpose (see docs/quality/sonar-report.md):
#  acr        Basic/Standard ACR cannot use private endpoints; access is controlled by Entra ID
#             (OIDC push from CI, kubelet identity pull), admin user disabled.
#  portalhttp Deployment Portal demo environments use nip.io hostnames, which have no TLS.
#  subscope   The bootstrap pipeline identity creates resource groups, so it needs subscription scope.
#  statelog   The state bucket is private, versioned, encrypted and TLS-only; access logging would
#             need a second bucket for a few KB of state.
#  felog1/2   The S3 + CloudFront frontend is behind enable_cloudfront (off); enable access logs with it.
sonar.issue.ignore.multicriteria=acr,portalhttp,subscope,statelog,felog1,felog2
sonar.issue.ignore.multicriteria.acr.ruleKey=terraform:S6329
sonar.issue.ignore.multicriteria.acr.resourceKey=infra/modules/azure/acr/main.tf
sonar.issue.ignore.multicriteria.portalhttp.ruleKey=kubernetes:S5332
sonar.issue.ignore.multicriteria.portalhttp.resourceKey=k8s/overlays/portal/env-patch.yaml
sonar.issue.ignore.multicriteria.subscope.ruleKey=terraform:S6387
sonar.issue.ignore.multicriteria.subscope.resourceKey=infra/bootstrap/main.tf
sonar.issue.ignore.multicriteria.statelog.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.statelog.resourceKey=infra/bootstrap/main.tf
sonar.issue.ignore.multicriteria.felog1.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.felog1.resourceKey=infra/modules/aws/frontend/main.tf
sonar.issue.ignore.multicriteria.felog2.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.felog2.resourceKey=infra/modules/aws/frontend/**
